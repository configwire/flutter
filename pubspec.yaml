name: configwire_flutter
description: Flutter companion for the ConfigWire client with SharedPreferences cache and device targeting.
version: 0.0.1
homepage: https://github.com/configwire/flutter
repository: https://github.com/configwire/flutter
issue_tracker: https://github.com/configwire/flutter/issues
documentation: https://github.com/configwire/flutter

topics:
  - remote-config
  - feature-flags
  - configuration

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  configwire: ^0.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
